apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: album
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: ghcr.io/senior-album/album-frontend:f9bd7a1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: album
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80

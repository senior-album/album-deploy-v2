apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: album
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:senior-album/album-deploy-v2.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: album
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

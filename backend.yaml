apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: album
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/senior-album/album-backend:35b73fc
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: album
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000